name: Update README cards
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone github-readme-stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git grs-src

      - name: Install dependencies
        run: |
          cd grs-src
          npm install

      - name: Start local server
        run: |
          cd grs-src
          PORT=9000 PAT_1="${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}" node express.js &
          echo "Waiting for local server to start..."
          sleep 5

      - name: Generate cards
        run: |
          mkdir -p profile
          curl -s "http://localhost:9000/api?username=hewel&show_icons=true&theme=tokyonight&rank_icon=github" -o profile/stats.svg
          curl -s "http://localhost:9000/api/top-langs?username=hewel&layout=compact&theme=tokyonight" -o profile/top-langs.svg

      - name: Verify generated SVGs
        run: |
          head -n 5 profile/stats.svg
          head -n 5 profile/top-langs.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: regenerate readme stats locally" || exit 0
          git push
